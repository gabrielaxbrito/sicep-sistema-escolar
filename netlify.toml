[build]
  base = "."
  command = ""
  publish = "frontend"
  functions = "backend/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[dev]
  framework = "#static"
  publish = "frontend"
  port = 8888

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
